<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#202333">
  <title>James Maggs · Not found</title>
  <meta name="robots" content="noindex">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;1,400&family=League+Spartan:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/styles/main.css">

  <style>
    .error-page {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      padding-top: calc(var(--header-height) + var(--space-24));
      padding-bottom: var(--space-24);
    }
    .error-inner {
      width: 100%;
    }
    .error-title {
      font-family: var(--font-display);
      font-size: var(--text-display);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: var(--space-6);
    }
    .error-text {
      font-family: var(--font-body);
      font-size: var(--text-lg);
      line-height: 1.85;
      max-width: 52ch;
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="/" class="header-name">James Maggs</a>
  </div>
</header>

<main>
  <section class="error-page">
    <div class="container error-inner">
      <span class="eyebrow">404</span>
      <h1 class="error-title">Not found.</h1>
      <p class="error-text">This page doesn't exist (or stopped existing). <a href="/">Back home</a>.</p>
    </div>
  </section>
</main>

</body>
</html>
