<html lang="en">
<head>

	<link rel="preconnect" href="https://fonts.googleapis.com">

	<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
	<style>

		/* ── Tokens ──────────────────────────────────────────────────────── */

		:root {
			--text-xs:   0.75rem;
			--text-sm:   0.875rem;
			--text-base: 1rem;
			--text-lg:   1.125rem;
			--text-xl:   1.375rem;
			--text-2xl:  1.75rem;
			--text-3xl:  2.25rem;
			--text-4xl:  3rem;
			--text-5xl:  4rem;
			--text-6xl:  5.5rem;

			--space-1:  0.25rem;
			--space-2:  0.5rem;
			--space-3:  0.75rem;
			--space-4:  1rem;
			--space-5:  1.25rem;
			--space-6:  1.5rem;
			--space-8:  2rem;
			--space-12: 3rem;
			--space-16: 4rem;
			--space-24: 6rem;
			--space-32: 8rem;

			--radius-sm:   3px;
			--radius-md:   6px;
			--radius-lg:   12px;
			--radius-full: 999px;

			--ease:          cubic-bezier(0.25, 0, 0, 1);
			--duration-fast: 120ms;
			--duration-base: 220ms;
			--duration-slow: 380ms;

			--bg-base:        oklch(26%  0.030 278);
			--bg-surface:     oklch(33%  0.028 277);
			--bg-elevated:    oklch(40%  0.027 275);
			--text-primary:   oklch(93%  0.003 248);
			--text-secondary: oklch(67%  0.025 271);
			--accent:         oklch(80%  0.158  75);
			--accent-hover:   oklch(88%  0.158  75);
			--border:         oklch(48%  0.027 274);

			--header-height: 60px;
		}

		/* ── Reset ───────────────────────────────────────────────────────── */

		*, *::before, *::after {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		/* ── Focus ───────────────────────────────────────────────────────── */

		:focus-visible {
			outline: 2px solid var(--accent);
			outline-offset: 3px;
		}

		html {
			font-size: 16px;
			scroll-behavior: smooth;
		}

		body {
			font-family: 'League Spartan', system-ui, sans-serif;
			font-size: var(--text-base);
			font-weight: 400;
			line-height: 1.6;
			background-color: var(--bg-base);
			color: var(--text-primary);
		}

		/* ── Layout ──────────────────────────────────────────────────────── */

		.container {
			max-width: 1100px;
			margin: 0 auto;
			padding: 0 var(--space-8);
		}

		/* ── Links ───────────────────────────────────────────────────────── */

		a {
			color: var(--accent);
			text-decoration: none;
			transition: color var(--duration-fast) var(--ease);
		}

		a:hover {
			color: var(--accent-hover);
			text-decoration: underline;
			text-underline-offset: 3px;
		}

		/* ── Header ──────────────────────────────────────────────────────── */

		.site-header {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			z-index: 100;
			height: var(--header-height);
			background-color: var(--bg-base);
			border-bottom: 1px solid var(--border);
		}

		.header-inner {
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: space-between;
		}

		.primary-nav {
			display: flex;
			gap: var(--space-6);
			list-style: none;
		}

		.primary-nav a {
			font-size: var(--text-xs);
			font-weight: 700;
			letter-spacing: 0.1em;
			text-transform: uppercase;
			color: var(--text-secondary);
			text-decoration: none;
			transition: color var(--duration-fast) var(--ease);
		}

		.primary-nav a:hover {
			color: var(--accent-hover);
			text-decoration: none;
		}

		.header-contact {
			display: flex;
			align-items: center;
			gap: var(--space-5);
		}

		.header-contact a {
			font-size: var(--text-sm);
			font-weight: 500;
			color: var(--text-secondary);
			text-decoration: none;
			transition: color var(--duration-fast) var(--ease);
		}

		.header-contact a:hover {
			color: var(--accent-hover);
			text-decoration: none;
		}

		.icon-link {
			display: flex;
			align-items: center;
		}

		/* ── Hero ────────────────────────────────────────────────────────── */

		.hero {
			min-height: 100svh;
			padding-top: calc(var(--header-height) + var(--space-16));
			padding-bottom: var(--space-16);
		}

		.hero-inner {
			display: grid;
			grid-template-columns: 1fr 340px;
			align-items: center;
			gap: var(--space-16);
			min-height: calc(100svh - var(--header-height));
		}

		.hero-eyebrow {
			display: block;
			font-size: var(--text-xs);
			font-weight: 700;
			letter-spacing: 0.12em;
			text-transform: uppercase;
			color: var(--text-secondary);
			margin-bottom: var(--space-4);
		}

		.hero-title {
			font-size: var(--text-5xl);
			font-weight: 600;
			line-height: 1;
			letter-spacing: -0.005em;
			margin-bottom: var(--space-6);
		}

		.hero-title .name {
			color: var(--accent);
		}

		.hero-tagline {
			font-size: var(--text-xl);
			font-weight: 300;
			line-height: 1.5;
			color: var(--text-secondary);
			max-width: 44ch;
		}

		.hero-photo {
			width: 340px;
			aspect-ratio: 3 / 4;
			background: var(--bg-elevated);
			border-radius: var(--radius-lg);
			border: 1px solid var(--border);
		}

		/* ── Placeholder sections ────────────────────────────────────────── */

		.section-placeholder {
			padding: var(--space-24) 0;
			border-top: 1px solid var(--border);
			color: var(--text-secondary);
			font-size: var(--text-sm);
		}

		/* ── Responsive ──────────────────────────────────────────────────── */

		@media (max-width: 768px) {
			.hero-inner {
				grid-template-columns: 1fr;
				text-align: center;
			}

			.hero-photo {
				width: 200px;
				margin: 0 auto;
				order: -1;
			}

			.hero-tagline {
				margin: 0 auto;
			}

			.header-contact .contact-text {
				display: none;
			}
		}

		@media (max-width: 640px) {
			.container {
				padding: 0 var(--space-4);
			}

			.hero-title {
				font-size: var(--text-4xl);
			}
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after {
				transition-duration: 0ms !important;
			}

			html {
				scroll-behavior: auto;
			}
		}

	</style>
</head>
